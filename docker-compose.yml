version: "3.9"

services:
  catsdogs-api:
    image: ${IMAGE:-catsdogs-api:local}
    build: .
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/srv/app/model.pt
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
