name: CD - Deploy & Smoke Test

on:
  workflow_run:
    workflows: ["CI - Test, Build & Publish Image"]
    branches: [main]
    types: [completed]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/catsdogs-api

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image
        run: docker pull ${{ env.IMAGE_NAME }}:latest

      - name: Deploy with docker compose
        run: |
          export IMAGE=${{ env.IMAGE_NAME }}:latest
          docker compose up -d
          sleep 5

      - name: Generate a sample image for the smoke test
        run: |
          pip install pillow numpy
          python scripts/generate_synthetic_data.py

      - name: Run smoke tests
        run: bash scripts/smoke_test.sh http://localhost:8000

      - name: Tear down (CI runner cleanup)
        if: always()
        run: docker compose down
